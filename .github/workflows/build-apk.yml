name: Build APK

# Builds the app on every push and publishes it as a GitHub release, so the newest APK is always at
# https://github.com/vladislav12384/Readcomic/releases/latest/download/Readcomic.apk
#
# A commit whose message has "[preview]" in it builds a preview instead: "Readcomic β", an app of
# its own installed next to the main one, published as a pre-release that is not the latest.

on:
  push:
    branches: [ccr-33b43d48-ibef97, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test and build
        if: ${{ !contains(github.event.head_commit.message, '[preview]') }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug -PversionCode=${{ github.run_number }}

      - name: Test and build the preview
        if: ${{ contains(github.event.head_commit.message, '[preview]') }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PversionCode=${{ github.run_number }} -Ppreview=true

      - name: Publish the preview
        if: ${{ contains(github.event.head_commit.message, '[preview]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Readcomic-preview.apk
          gh release create "preview-${{ github.run_number }}" Readcomic-preview.apk \
            --target "${{ github.sha }}" \
            --title "Readcomic β ${{ github.run_number }} — пробная сборка" \
            --prerelease \
            --latest=false \
            --notes "Пробная сборка из коммита ${{ github.sha }}, не основная.

          **Readcomic-preview.apk** ставится отдельным приложением «Readcomic β» рядом с основным и ничего в нём не меняет (у пробной своя библиотека).

          © vladislav12384, https://github.com/vladislav12384/Readcomic — лицензия CC BY-NC-SA 4.0: только некоммерческое использование, с указанием автора и ссылки (см. NOTICE.md)."

      - name: Publish release
        if: ${{ !contains(github.event.head_commit.message, '[preview]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Readcomic.apk
          cp app/build/outputs/apk/debug/app-debug.apk Readcomic-debug.apk
          gh release create "build-${{ github.run_number }}" Readcomic.apk Readcomic-debug.apk \
            --target "${{ github.sha }}" \
            --title "Readcomic 0.2.${{ github.run_number }}" \
            --latest \
            --notes "Сборка из коммита ${{ github.sha }}.

          **Readcomic.apk** — обычная версия, её и ставить.
          **Readcomic-debug.apk** — отладочная, на случай если обычная не запустится.

          Обе подписаны одним ключом, каждая новая сборка ставится поверх старой.

          © vladislav12384, https://github.com/vladislav12384/Readcomic — лицензия CC BY-NC-SA 4.0: только некоммерческое использование, с указанием автора и ссылки (см. NOTICE.md)."
